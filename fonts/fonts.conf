<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Isolated font setup replicating the Hark sandbox (Debian 13) that renders locally:
     only DejaVu + URW Nimbus Mono PS, with the sandbox's conf.d rules. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/fc-cache-am</cachedir>
  <include ignore_missing="yes" prefix="relative">conf.d</include>
</fontconfig>
